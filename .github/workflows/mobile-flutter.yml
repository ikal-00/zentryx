name: Zentryx Mobile CI

on:
  push:
    branches:
      - feature/flutter-mobile
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-flutter.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-flutter.yml"

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze, tests and Android build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate standard mobile platform scaffold
        working-directory: mobile
        run: |
          flutter create . --platforms=android,ios --org com.zentryx --project-name zentryx_mobile
          rm -f test/widget_test.dart
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test
      - name: Build Android debug APK
        working-directory: mobile
        run: flutter build apk --debug
