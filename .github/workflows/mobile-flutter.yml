name: Zentryx Mobile CI

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-flutter.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-flutter.yml"

permissions:
  contents: read

concurrency:
  group: zentryx-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android · analyze, tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate standard Android scaffold
        working-directory: mobile
        run: |
          flutter create . --platforms=android --org com.zentryx --project-name zentryx_mobile
          rm -f test/widget_test.dart
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Upload resolved dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: zentryx-dependency-lock
          path: mobile/pubspec.lock
          retention-days: 7
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test --dart-define=ZENTRYX_CAPTURE_REVIEW=true
      - name: Upload Flutter visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zentryx-visual-review
          path: mobile/build/visual-review/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Build Android debug APK
        working-directory: mobile
        run: flutter build apk --debug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zentryx-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS · simulator build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate standard iOS scaffold
        working-directory: mobile
        run: |
          flutter create . --platforms=ios --org com.zentryx --project-name zentryx_mobile
          rm -f test/widget_test.dart
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Build iOS simulator app
        working-directory: mobile
        run: flutter build ios --simulator --debug
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: zentryx-ios-simulator
          path: mobile/build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
          retention-days: 7
      - name: Boot iPhone simulator for native persistence test
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          echo "ZENTRYX_SIMULATOR=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Native driver flow and save session
        working-directory: mobile
        run: flutter test integration_test/driver_restart_test.dart -d "$ZENTRYX_SIMULATOR" --no-uninstall --dart-define=ZENTRYX_RESTART_PHASE=write
      - name: Restore session in a new native app process
        working-directory: mobile
        run: flutter test integration_test/driver_restart_test.dart -d "$ZENTRYX_SIMULATOR" --no-uninstall --dart-define=ZENTRYX_RESTART_PHASE=restore
