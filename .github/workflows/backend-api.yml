name: Backend API checks

on:
  push:
    paths:
      - "backend/**"
      - "contracts/**"
      - "BD/**"
      - ".github/workflows/backend-api.yml"
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - "BD/**"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/zentryx
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: zentryx
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zentryx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: python -m pip install "flask>=3.1,<4" "python-dotenv>=1,<2" "psycopg[binary,pool]>=3,<4"
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run backend unit and PostGIS integration tests
        run: python -m unittest discover -s backend/tests -v
