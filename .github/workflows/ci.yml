name: Zentryx CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install app dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Lint Python
        run: |
          python -m pip install ruff==0.15.7
          python -m ruff check app backend scripts
      - name: Compile app
        run: python -m compileall -q app
      - name: Run app tests
        run: python -m unittest discover -s app/tests -v

  backend:
    name: Backend + PostGIS checks
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zentryx_test
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: zentryx_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zentryx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: ci-only-password
          API_BIND_IP: 127.0.0.1
        run: docker compose config --quiet
      - name: Run backend unit and PostGIS integration tests
        run: python -m unittest discover -s backend/tests -v

  container:
    name: Docker runtime + persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: zentryx-ci
      POSTGRES_PASSWORD: ci-disposable-password
      API_BIND_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: bash -n app/run_shared_api.sh scripts/deploy.sh scripts/check_container.sh
      - name: Build and verify real API, simulator and persistent data
        run: bash scripts/check_container.sh
      - name: Container diagnostics
        if: failure()
        run: docker compose --profile demo logs --tail=100
      - name: Stop disposable CI containers
        if: always()
        run: docker compose --profile demo stop

  deploy:
    name: Production deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [app, backend, container]
    uses: ./.github/workflows/deploy.yml
