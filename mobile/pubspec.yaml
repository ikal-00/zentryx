name: zentryx_mobile
description: Native cross-platform mobile client for Zentryx.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_map: ^8.1.1
  flutter_riverpod: ^2.6.1
  latlong2: ^0.9.1
  shared_preferences: ^2.5.5

dev_dependencies:
  fake_async: ^1.3.3
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
