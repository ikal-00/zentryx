name: zentryx

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zentryx}
      POSTGRES_USER: ${POSTGRES_USER:-zentryx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - zentryx_db:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zentryx} -d ${POSTGRES_DB:-zentryx}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: zentryx-api:local
    restart: unless-stopped
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-zentryx}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zentryx}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
          python -m backend.seed_routes &&
          exec gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 4 --timeout 30 --access-logfile - --error-logfile - 'backend.app:create_app()'
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/v1/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  simulator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: zentryx-api:local
    profiles: ["demo"]
    restart: unless-stopped
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-zentryx}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zentryx}
      DEV_API_BASE_URL: http://api:5000
      SIM_DEVICE_ID: ${SIM_DEVICE_ID:-gps-demo-01}
      SIM_VEHICLE_ID: ${SIM_VEHICLE_ID:-unit-demo-01}
      SIM_ROUTE_ID: ${SIM_ROUTE_ID:-route-l2}
      SIM_SPEED_MPS: ${SIM_SPEED_MPS:-8.0}
      SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-2.0}
      SIM_START_PROGRESS_M: ${SIM_START_PROGRESS_M:-1200}
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "backend.dev_simulator"]

volumes:
  zentryx_db:
